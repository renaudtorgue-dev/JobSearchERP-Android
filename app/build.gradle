plugins { id 'com.android.application' }

android {
    namespace 'com.renaud.jobsearcherp'
    compileSdk 35

    defaultConfig {
        applicationId 'com.renaud.jobsearcherp.android10'
        minSdk 23
        targetSdk 29
        versionCode 2
        versionName '1.0.1-android10'
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }

    buildTypes {
        debug {
            signingConfig signingConfigs.debug
            minifyEnabled false
        }
    }
}
